/**:
  ros__parameters:
    laser_topic: "/hesai/jt128/dual_points_superodom"
    # Choose one physical IMU as the SuperOdom primary IMU until a dedicated
    # multi-IMU estimator is introduced.
    imu_topic: "/front/hesai/jt128/imu"
    sensor: "jt128"
    use_imu_roll_pitch: false
    save_ply: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "front_hesai_jt128"
    sensor_frame_rot: "front_hesai_jt128_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    feature_extraction_node:
      scan_line: 128
      provide_point_time: 1
      require_imu_init_before_lidar: true
      feature_cloud_frame: "front_hesai_jt128_gravity"
      # Unitree A2 JT128 bag IMU uses g for acceleration and deg/s for gyro.
      imu_acc_scale: 9.80665
      imu_gyr_scale: 0.017453292519943295
      min_range: 0.5
      max_range: 150.0
      filter_point_size: 3
      mapping_skip_frame: 1

    laser_mapping_node:
      mapping_line_resolution: 0.1
      mapping_plane_resolution: 0.4
      max_iterations: 5
      max_surface_features: 4000
      lio_diagnostics_enabled: true
      lio_diagnostics_period: 10
      plane_neighbor_distance_factor: 4.0
      plane_pca_min_ratio: 0.05
      plane_max_point_distance_factor: 0.75
      plane_loss_distance_factor: 3.0
      localization_mode: false
      read_pose_file: false
      use_rviz_initial_pose: false
      rviz_initial_pose_xy_yaw_only: true
      init_x: 0.0
      init_y: 0.0
      init_z: 0.0
      init_roll: 0.0
      init_pitch: 0.0
      init_yaw: 0.0

    imu_preintegration_node:
      lidar_correction_noise: 0.01
      acc_n: 3.9939570888238808e-03
      gyr_n: 1.5636343949698187e-03
      acc_w: 6.4356659353532566e-05
      gyr_w: 3.5640318696367613e-05
      g_norm: 9.80511
      imu_acc_scale: 9.80665
      imu_gyr_scale: 0.017453292519943295
      failure_velocity_threshold: 30.0
      failure_acc_bias_threshold: 2.0
      failure_gyr_bias_threshold: 1.0
      failure_startup_acc_bias_threshold: 2.0
      failure_startup_key_count: 0

odom_frame_transform_node:
  ros__parameters:
    input_odom_topic: "/imu_odometry"
    output_odom_topic: "/body_odometry"
    output_child_frame: "base_link"
    publish_tf: true
    extrinsic_rpy_degrees: false
    # Unitree A2 structural-design extrinsic from raw front JT128 frame to base_link.
    lidar_to_body_xyzrpy: [0.33767, 0.0, 0.08134, 1.57079632679, 0.0, 1.57079632679]
